name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clean old artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            // Get all artifacts from this specific workflow run
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Filter for github-pages artifacts from this run only
            const gpArtifacts = artifacts.data.artifacts.filter(
              a => a.name === 'github-pages' && a.workflow_run.id === context.runId
            );

            console.log(`Found ${gpArtifacts.length} github-pages artifacts in this run`);

            // Keep only the most recent one (they're sorted by newest first)
            if (gpArtifacts.length > 1) {
              const toDelete = gpArtifacts.slice(1);
              for (const artifact of toDelete) {
                console.log(`Deleting artifact: ${artifact.id}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
        continue-on-error: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clean old artifacts
        run: |
          # Get all artifacts named "github-pages"
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | select(.name=="github-pages") | .id' || true)
          
          # Count artifacts
          ARTIFACT_COUNT=$(echo "$ARTIFACTS" | grep -c . || echo 0)
          
          if [ "$ARTIFACT_COUNT" -gt 1 ]; then
            echo "Found $ARTIFACT_COUNT github-pages artifacts, keeping only the latest..."
            # Keep the last artifact, delete others
            ARTIFACT_ARRAY=($ARTIFACTS)
            for i in "${!ARTIFACT_ARRAY[@]}"; do
              if [ $i -lt $((${#ARTIFACT_ARRAY[@]} - 1)) ]; then
                echo "Deleting artifact ${ARTIFACT_ARRAY[$i]}"
                gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ARRAY[$i]} || true
              fi
            done
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
